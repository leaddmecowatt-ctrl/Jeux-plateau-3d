<div id="demo-hud" class="demo-hud" aria-label="Combat en cours">
  <div class="demo-combat-titre">
    <div class="demo-arene"><span class="demo-pokeball" aria-hidden="true"></span><span>Arène Golden</span></div>
    <div id="demo-combat-noms">Pikachu · Dracaufeu</div>
    <div id="demo-combat-phase">Les combattants entrent dans l’arène</div>
  </div>
  <div class="demo-combat-action"><span id="demo-combat-attaque">Le spectacle commence</span></div>
</div>
<div class="demo-commandes" role="group" aria-label="Réglages du spectacle">
  <span class="demo-badge" aria-label="Plateau Golden">Golden</span>

  <button id="demo-son" type="button" aria-pressed="false" title="Activer l’ambiance sonore">

  </button>
  <button id="demo-qualite" type="button" aria-pressed="false" title="Passer en mode économie">
    <span class="demo-icone-qualite" aria-hidden="true"></span><span>Qualité M1</span>
  </button>
