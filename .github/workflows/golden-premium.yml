name: Golden Premium - aperçu jouable
on:
  workflow_dispatch:
  push:
    branches:
      - astra/golden-premium-personnage
jobs:
  construire:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4
      - name: Appliquer la finition Golden
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("board3d_golden.js")
          s=p.read_text(encoding="utf-8")
          def remplace(a,b):
              global s
              assert a in s, "Motif absent : "+a[:70]
              s=s.replace(a,b,1)
          debut=s.index("  // ===== VIP : couronne royale")
          fin=s.index("  // mèches de côté",debut)
          s=s[:debut]+"  // Golden Premium : silhouette originale, sans accessoires VIP.\n"+s[fin:]
          debut=s.index("  const COL = { peau:LUFFY_COL.peau")
          fin=s.index("  const OUT_W =",debut)
          s=s[:debut]+"""  // Or métallique différencié, sans modifier le squelette ni les animations.
          const OR_MASSIF = 0xf5cf4a;
          const OR_NUANCES = { cheveux:0xe9c34a, gilet:0xffdf73, short:0xf5cf4a,
            revers:0xffe27a, echarpe:0xe9c34a, bouton:0xfff4b8,
            semelle:0xc98f17, laniere:0xffdf73, cicatrice:0xdca72e };
          const COL = Object.fromEntries(Object.keys(parts).map(k=>[k, OR_NUANCES[k] || OR_MASSIF]));
          COL.visage = 0xffffff;
          const EMI = Object.fromEntries(Object.keys(parts).map(k=>[k, 0x251903]));
          EMI.visage = 0x000000;
          """+s[fin:]
          remplace("visage: new THREE.MeshToonMaterial({ map:faceTex.ouvert, gradientMap:grad }),","visage: new THREE.MeshStandardMaterial({ map:faceTex.ouvert, color:0xffdf73, metalness:0.65, roughness:0.30, side:THREE.DoubleSide }),")
          remplace("corps: withEmi(new THREE.MeshToonMaterial({ color:0xffffff, gradientMap:grad, vertexColors:true, side:THREE.DoubleSide })),","corps: withEmi(new THREE.MeshStandardMaterial({ color:0xffffff, metalness:0.66, roughness:0.31, vertexColors:true, side:THREE.DoubleSide })),")
          remplace("const hm = new THREE.MeshToonMaterial({ color: band ? 0xd01c24 : 0xe8c078, gradientMap:grad, side:THREE.DoubleSide,\n        emissive: band ? 0xa01018 : 0x7a5a16 });","const hm = new THREE.MeshStandardMaterial({ color: band ? 0xb60923 : 0xf5cf4a, metalness: band ? 0.36 : 0.68, roughness: band ? 0.32 : 0.30, side:THREE.DoubleSide, emissive: band ? 0x280005 : 0x100801 });")
          remplace("o.material = hm; o.visible = false;   // VIP : couronne à la place du chapeau","o.material = hm; o.visible = true;   // Golden : chapeau et ruban visibles")
          remplace("ol.name = 'luffy_contour_chapeau'; ol.frustumCulled = false; ol.visible = false;","ol.name = 'luffy_contour_chapeau'; ol.frustumCulled = false; ol.visible = true;")
          p.write_text(s,encoding="utf-8")
          PY
      - name: Vérifier JavaScript
        run: |
          cp board3d.js /tmp/classique.mjs
          cp board3d_golden.js /tmp/golden.mjs
          node --check /tmp/classique.mjs
          node --check /tmp/golden.mjs
      - name: Construire le jeu autonome
        run: python3 tools/build.py --out dist/pikajackpot.html
      - name: Publier le fichier jouable
        uses: actions/upload-artifact@v4
        with:
          name: golden-premium-iphone
          path: dist/pikajackpot.html
          retention-days: 14
      - name: Enregistrer le HTML sur une branche de démonstration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/golden-premium-build
          cp dist/pikajackpot.html /tmp/golden-premium-build/pikajackpot.html
          git fetch origin astra/golden-premium-build || true
          if git show-ref --verify --quiet refs/remotes/origin/astra/golden-premium-build; then
            git checkout -B astra/golden-premium-build origin/astra/golden-premium-build
          else
            git checkout --orphan astra/golden-premium-build
            git rm -rf --ignore-unmatch .
          fi
          mkdir -p dist
          cp /tmp/golden-premium-build/pikajackpot.html dist/pikajackpot.html
          git add -f dist/pikajackpot.html
          git commit -m "Mettre à jour la démonstration Golden Premium" || echo "Aucune modification"
          git push origin HEAD:refs/heads/astra/golden-premium-build
          echo "SHA final : $(git rev-parse HEAD)"
