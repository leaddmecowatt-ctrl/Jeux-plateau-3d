name: Golden Premium - aperçu jouable
on:
  workflow_dispatch:
  push:
    branches:
      - astra/golden-premium-personnage
jobs:
  construire:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4
      - name: Appliquer la finition Golden
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("board3d_golden.js")
          s=p.read_text(encoding="utf-8")
          def remplace(a,b):
              global s
              assert a in s, "Motif absent : "+a[:70]
              s=s.replace(a,b,1)
          debut=s.index("  // ===== VIP : couronne royale")
          fin=s.index("  // mèches de côté",debut)
          s=s[:debut]+"  // Golden Premium : silhouette originale, sans accessoires VIP.\n"+s[fin:]
          debut=s.index("  const COL = { peau:LUFFY_COL.peau")
          fin=s.index("  const OUT_W =",debut)
          s=s[:debut]+"""  // Or métallique différencié, sans modifier le squelette ni les animations.
          const OR_MASSIF = 0xf5cf4a;
          const OR_NUANCES = { cheveux:0xe9c34a, gilet:0xffdf73, short:0xf5cf4a,
            revers:0xffe27a, echarpe:0xe9c34a, bouton:0xfff4b8,
            semelle:0xc98f17, laniere:0xffdf73, cicatrice:0xdca72e };
          const COL = Object.fromEntries(Object.keys(parts).map(k=>[k, OR_NUANCES[k] || OR_MASSIF]));
          COL.visage = 0xffffff;
          const EMI = Object.fromEntries(Object.keys(parts).map(k=>[k, 0x251903]));
          EMI.visage = 0x000000;
          """+s[fin:]
          remplace("visage: new THREE.MeshToonMaterial({ map:faceTex.ouvert, gradientMap:grad }),","visage: new THREE.MeshStandardMaterial({ map:faceTex.ouvert, color:0xffdf73, metalness:0.65, roughness:0.30, side:THREE.DoubleSide }),")
          remplace("corps: withEmi(new THREE.MeshToonMaterial({ color:0xffffff, gradientMap:grad, vertexColors:true, side:THREE.DoubleSide })),","corps: withEmi(new THREE.MeshStandardMaterial({ color:0xffffff, metalness:0.66, roughness:0.31, vertexColors:true, side:THREE.DoubleSide })),")
          remplace("const hm = new THREE.MeshToonMaterial({ color: band ? 0xd01c24 : 0xe8c078, gradientMap:grad, side:THREE.DoubleSide,\n        emissive: band ? 0xa01018 : 0x7a5a16 });","const hm = new THREE.MeshStandardMaterial({ color: band ? 0xb60923 : 0xf5cf4a, metalness: band ? 0.36 : 0.68, roughness: band ? 0.32 : 0.30, side:THREE.DoubleSide, emissive: band ? 0x280005 : 0x100801 });")
          remplace("o.material = hm; o.visible = false;   // VIP : couronne à la place du chapeau","o.material = hm; o.visible = true;   // Golden : chapeau et ruban visibles")
          remplace("ol.name = 'luffy_contour_chapeau'; ol.frustumCulled = false; ol.visible = false;","ol.name = 'luffy_contour_chapeau'; ol.frustumCulled = false; ol.visible = true;")
          p.write_text(s,encoding="utf-8")
          PY
      - name: Sculpter les quatre Hyper Balls dorées
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("board3d_golden.js")
          s = p.read_text(encoding="utf-8")
          old = """    // sphère d'or (par défaut) : boule polie, anneau gravé, cœur lumineux
              const sph = new THREE.Group();
              sph.add(new THREE.Mesh(new THREE.SphereGeometry(0.42, 48, 32), sphereMat));
              { const r = new THREE.Mesh(new THREE.TorusGeometry(0.43, 0.035, 16, 72), orSombre); r.rotation.x = Math.PI/2; sph.add(r); }
              { const b = new THREE.Mesh(new THREE.SphereGeometry(0.1, 24, 16), new THREE.MeshStandardMaterial({ color:0xfff6c9, emissive:0xffe27a, emissiveIntensity:1.6 })); b.position.set(0, 0, 0.4); sph.add(b); }"""
          # Conserver l'indentation originale : bloc ciblé et strict.
          new = """    // Master Ball premium : violet, pastilles fuchsia et M blanc.
              const sph = new THREE.Group();
              const violet = new THREE.MeshPhysicalMaterial({color:0x6536a9, metalness:0.22, roughness:0.26, clearcoat:0.95, clearcoatRoughness:0.13});
              const rose = new THREE.MeshPhysicalMaterial({color:0xec3f94, metalness:0.20, roughness:0.27, clearcoat:0.9});
              const blanc = new THREE.MeshPhysicalMaterial({color:0xf8f6ff, metalness:0.12, roughness:0.27, clearcoat:0.75});
              const joint = new THREE.MeshStandardMaterial({color:0x17131f, metalness:0.35, roughness:0.33});
              const argent = new THREE.MeshStandardMaterial({color:0xe5e6f0, metalness:0.5, roughness:0.26});
              sph.add(new THREE.Mesh(new THREE.SphereGeometry(0.42, 64, 40, 0, Math.PI*2, 0, Math.PI/2), violet));
              sph.add(new THREE.Mesh(new THREE.SphereGeometry(0.42, 64, 40, 0, Math.PI*2, Math.PI/2, Math.PI/2), blanc));
              // Pastilles rose fuchsia symétriques sur les épaules supérieures.
              for (const phi of [0.25, Math.PI-0.85]) {
                sph.add(new THREE.Mesh(new THREE.SphereGeometry(0.428, 32, 20, phi, 0.60, 0.25, 0.63), rose));
              }
              // Grand M blanc sur l'avant (+Z), en ruban 3D sur la sphère.
              const mPts = [
                [-0.19,0.14],[-0.12,0.30],[-0.01,0.19],[0.08,0.30],[0.18,0.14]
              ];
              const m3 = mPts.map(([x,y]) => new THREE.Vector3(x,y,Math.sqrt(Math.max(0.001,0.432*0.432-x*x-y*y))));
              sph.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(m3), 32, 0.025, 8, false), blanc));
              const ceinture = new THREE.Mesh(new THREE.TorusGeometry(0.423, 0.030, 12, 80), joint);
              ceinture.rotation.x = Math.PI/2; sph.add(ceinture);
              const bouton = new THREE.Group();
              bouton.position.z = 0.43;
              const base = new THREE.Mesh(new THREE.CylinderGeometry(0.126,0.126,0.045,40), joint);
              base.rotation.x = Math.PI/2; bouton.add(base);
              const anneau = new THREE.Mesh(new THREE.TorusGeometry(0.091,0.022,12,48), argent);
              anneau.position.z = 0.030; bouton.add(anneau);
              const disque = new THREE.Mesh(new THREE.CircleGeometry(0.069,40), blanc);
              disque.position.z = 0.035; bouton.add(disque);
              sph.add(bouton);"""
          if s.count(old) != 1:
              raise SystemExit("Le bloc des quatre sphères a changé : arrêt sans modification")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Vérifier JavaScript
        run: |
          cp board3d.js /tmp/classique.mjs
          cp board3d_golden.js /tmp/golden.mjs
          node --check /tmp/classique.mjs
          node --check /tmp/golden.mjs
      - name: Construire le jeu autonome
        run: python3 tools/build.py --out dist/pikajackpot.html
      - name: Publier le fichier jouable
        uses: actions/upload-artifact@v4
        with:
          name: golden-premium-iphone
          path: dist/pikajackpot.html
          retention-days: 14
      - name: Enregistrer le HTML sur une branche de démonstration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/golden-premium-build
          cp dist/pikajackpot.html /tmp/golden-premium-build/pikajackpot.html
          git reset --hard HEAD
          git clean -fdx
          git fetch origin refs/heads/astra/golden-premium-build:refs/remotes/origin/astra/golden-premium-build || true
          if git show-ref --verify --quiet refs/remotes/origin/astra/golden-premium-build; then
            git checkout -B astra/golden-premium-build origin/astra/golden-premium-build
          else
            git checkout --orphan astra/golden-premium-build
            git rm -rf --ignore-unmatch .
          fi
          mkdir -p dist
          cp /tmp/golden-premium-build/pikajackpot.html dist/pikajackpot.html
          git add -f dist/pikajackpot.html
          git commit -m "Mettre à jour la démonstration Golden Premium" || echo "Aucune modification"
          git push origin HEAD:refs/heads/astra/golden-premium-build
          echo "SHA final : $(git rev-parse HEAD)"
