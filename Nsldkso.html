<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Plateau Live 3D — 40 cases</title>
<style>
:root{
  --cyan:#19d6ff; --blue:#0d66ff; --navy:#06142c; --navy2:#0b2852;
  --yellow:#ffd83c; --white:#f7fbff; --ink:#102949;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;background:#020714;font-family:Arial,Helvetica,sans-serif}
body{overflow:hidden;color:#fff}
#app{
  width:100vw;height:100dvh;overflow:hidden;
  display:flex;flex-direction:column;
  background:
    radial-gradient(circle at 50% 38%,rgba(20,118,255,.22),transparent 34%),
    linear-gradient(#041126 0 16%,#061733 44%,#020817 100%);
}

/* HUD haut */
.top-hud{
  flex:0 0 auto;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:max(10px,env(safe-area-inset-top)) 12px 6px;
  position:relative;z-index:5;
}
.player-card,.next-card{
  border:2px solid #37caff;
  background:linear-gradient(180deg,#0e4792,#08275b);
  box-shadow:0 0 10px rgba(0,125,255,.6);
  border-radius:12px;
}
.player-card{
  width:132px;height:52px;display:grid;grid-template-columns:43px 1fr;align-items:center;
  padding:4px 7px 4px 3px;
}
.avatar-mini{width:39px;height:39px;border-radius:7px;background:#dcefff;overflow:hidden;border:1px solid #7fe5ff}
.player-card b{display:block;font-size:12px}.coins{font-size:12px;color:#ffd84a;font-weight:900}
.next-card{
  width:160px;height:58px;text-align:center;padding-top:5px;
}
.next-card small{font-weight:800}
.next-num{
  margin:4px auto 0;width:48px;height:29px;line-height:25px;border-radius:6px;
  background:#0d4b99;border:2px solid #50cfff;font-size:22px;font-weight:900
}

/* zone principale = décor de stade + plateau 3D + panneau latéral */
.main-row{
  flex:1 1 auto;min-height:0;position:relative;
  display:flex;flex-direction:column;align-items:stretch;
  padding:2px 10px 4px;
  overflow:hidden;
}
/* emplacement réservé pour le bâtiment : jamais recouvert par le
   canvas 3D (qui est opaque), toujours au-dessus du plateau */
.stadium-slot{
  flex:0 0 auto;height:96px;position:relative;z-index:0;pointer-events:none;
  display:flex;align-items:flex-end;justify-content:center;
}
.board-row{
  flex:1 1 auto;min-height:0;position:relative;z-index:1;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
}

/* ---------- décor d'arène (bâtiment, montagnes, projecteurs), tout
   dessiné en CSS pure — un décor original, pas une image reprise
   ailleurs, et sans logo ou signe de marque. ---------- */
.stadium{position:absolute;inset:-4% -6% -2%;overflow:hidden;pointer-events:none;z-index:0}
.stad-haze{
  position:absolute;left:0;right:0;top:8%;height:30%;
  background:linear-gradient(180deg,rgba(140,190,255,.16),rgba(140,190,255,0));
}
.stad-mountain{
  position:absolute;bottom:34%;width:62%;height:26%;
  background:linear-gradient(180deg,#33547f,#152a4c);
  clip-path:polygon(0% 100%,8% 55%,20% 78%,32% 40%,46% 68%,58% 30%,72% 62%,86% 45%,100% 100%);
  opacity:.55;
}
.stad-mountain.m1{left:-12%}
.stad-mountain.m2{right:-14%;bottom:33%;height:20%;opacity:.4;filter:hue-rotate(10deg)}
.stad-mountain.m3{left:22%;bottom:37%;width:40%;height:15%;opacity:.28;filter:blur(.5px)}

.stad-building{position:relative;flex:0 0 auto;width:172px;height:126px;transform:scale(.72);transform-origin:bottom center}
.stad-building .antenna{
  position:absolute;left:50%;top:-22px;width:2px;height:22px;background:#9fc4e8;
}
.stad-building .flag{
  position:absolute;left:50%;top:-22px;width:16px;height:10px;
  background:linear-gradient(90deg,#ffd54a,#ffb020);
  clip-path:polygon(0 0,100% 20%,0 40%);
}
.stad-building .roof{
  position:absolute;left:50%;top:0;transform:translateX(-50%);width:0;height:0;
  border-left:92px solid transparent;border-right:92px solid transparent;border-bottom:30px solid #2f5fa8;
  filter:drop-shadow(0 3px 3px rgba(0,0,0,.35));
}
.stad-building .roof:after{
  content:"";position:absolute;left:-92px;top:-30px;width:184px;height:6px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);
}
.stad-building .facade{
  position:absolute;inset:26px 0 0;background:linear-gradient(180deg,#eef6ff,#a9c6e2);
  border-radius:6px 6px 3px 3px;box-shadow:0 14px 28px rgba(0,0,0,.5),inset 0 -18px 20px -10px rgba(30,60,100,.25);
}
.stad-building .badge{
  position:absolute;left:50%;top:14px;transform:translateX(-50%);width:34px;height:34px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff,#bfe0ff 45%,#4f8fdc 100%);
  border:3px solid #1c3f6e;box-shadow:0 2px 6px rgba(0,0,0,.35);
  display:flex;align-items:center;justify-content:center;
}
.stad-building .badge:before{
  content:"";width:12px;height:12px;
  background:#1c3f6e;
  clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
}
.stad-building .winrow{position:absolute;left:12px;right:12px;display:flex;justify-content:space-between}
.stad-building .winrow.r1{top:56px}
.stad-building .winrow.r2{top:80px}
.stad-building .win{width:11px;height:14px;background:#ffe37a;border-radius:2px;box-shadow:0 0 9px rgba(255,220,120,.85)}
.stad-building .win.off{background:#3a5a86;box-shadow:none;opacity:.7}
.stad-building .door{
  position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:34px;height:22px;
  background:linear-gradient(180deg,#264a76,#132842);border-radius:4px 4px 0 0;
}
.stad-building .glow-pool{
  position:absolute;left:50%;bottom:-10px;transform:translateX(-50%);width:140px;height:26px;border-radius:50%;
  background:radial-gradient(ellipse,rgba(160,210,255,.35),transparent 70%);
}

.stad-light{position:absolute;top:4%;width:6px;height:34%;background:linear-gradient(180deg,#0e2c52,#04101f);border-radius:3px}
.stad-light.left{left:4%}
.stad-light.right{right:4%}
.stad-light .beam{
  position:absolute;top:-2px;left:50%;transform:translateX(-50%);width:2px;height:0;
  border-left:60px solid transparent;border-right:60px solid transparent;border-bottom:150px solid rgba(190,225,255,.14);
  transform-origin:top center;
}
.stad-light.left .beam{transform:translateX(-50%) rotate(18deg)}
.stad-light.right .beam{transform:translateX(-50%) rotate(-18deg)}
.stad-light .glow{
  position:absolute;top:-15px;left:50%;transform:translateX(-50%);width:34px;height:34px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.95),rgba(190,225,255,.5) 45%,transparent 75%);
  box-shadow:0 0 46px 16px rgba(180,225,255,.35);
}

.board-wrap{
  width:min(95vw,560px);
  aspect-ratio:1/1;
  position:relative;z-index:1;
  filter:drop-shadow(0 22px 26px rgba(0,0,0,.55));
}
#gl{
  position:absolute;inset:0;width:100%;height:100%;display:block;
  border-radius:14px;
  cursor:grab;
  touch-action:none;
}
#gl:active{cursor:grabbing}
.gl-fallback{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  text-align:center;padding:20px;font-size:13px;color:#cfe6ff;
  background:radial-gradient(circle at 50% 40%,#0b2852,#040d1f);border-radius:14px;
}
.hint3d{
  position:absolute;left:50%;bottom:6px;transform:translateX(-50%);
  font-size:9px;letter-spacing:.03em;color:rgba(210,235,255,.55);
  background:rgba(4,16,36,.45);border:1px solid rgba(90,190,255,.3);
  border-radius:20px;padding:3px 10px;pointer-events:none;white-space:nowrap;
  transition:opacity .6s ease;z-index:2;
}

/* panneau latéral : Interface Animateur + légende */
.side-panel{
  position:relative;z-index:1;width:100%;max-width:560px;
  display:flex;flex-direction:column;gap:8px;
}
.controls-panel{
  display:grid;grid-template-columns:1fr auto;gap:8px;
  background:linear-gradient(180deg,#092d63,#051a3d);
  border:2px solid #23a9ff;border-radius:12px;padding:9px;
  box-shadow:0 0 12px rgba(0,127,255,.55);
}
.control-copy{display:flex;align-items:center;justify-content:space-between;gap:8px}
.side-title{font-size:13px;font-weight:900}
.side-label{font-size:10px;color:#d6eeff;margin-top:2px}
.selector{display:grid;grid-template-columns:34px 48px 34px;gap:5px;align-items:center}
.arrow{
  height:36px;border:0;border-radius:8px;background:#0c4b94;color:#fff;font-size:24px;font-weight:900;
  border:1px solid rgba(82,215,255,.55)
}
.sel-value{
  height:38px;display:flex;align-items:center;justify-content:center;border-radius:7px;
  background:#0b4389;border:2px solid #4ed3ff;font-size:24px;font-weight:900
}
.validate{
  min-width:105px;border:0;border-radius:10px;
  background:linear-gradient(#ffe55c,#f4ba12);color:#18304f;font-weight:900;font-size:14px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.6)
}
button:disabled{opacity:.48;filter:grayscale(.7)}
button:active:not(:disabled){transform:translateY(1px)}

.legend{
  background:linear-gradient(180deg,#092a5a,#061833);
  border:1px solid #299fff;border-radius:10px;padding:9px 10px;
}
.legend-title{font-size:11px;font-weight:900;color:#eaf6ff;margin-bottom:7px;letter-spacing:.02em}
.legend-list{display:flex;flex-direction:column;gap:6px}
.legend-row{display:flex;align-items:center;gap:7px;font-size:10.5px}
.sw{width:11px;height:11px;border-radius:3px;flex:none}
.sw-white{background:linear-gradient(145deg,#eaf5ff,#9dbbd2)}
.sw-yellow{background:linear-gradient(145deg,#ffe154,#f1a714)}
.sw-red{background:linear-gradient(145deg,#ff686e,#dc2946)}
.sw-green{background:linear-gradient(145deg,#55e58c,#07965e)}
.sw-purple{background:linear-gradient(145deg,#c976eb,#8245c8)}

.statusbar{
  flex:0 0 auto;margin:4px 10px 10px;min-height:42px;border:2px solid #1f98ff;border-radius:10px;
  background:linear-gradient(180deg,#0c3977,#071d44);
  box-shadow:0 0 10px rgba(0,117,255,.42);
  display:flex;align-items:center;justify-content:center;position:relative;
  font-size:12px;font-weight:800;padding:7px 78px 7px 42px
}
.ball{
  position:absolute;left:10px;top:5px;width:30px;height:30px;border-radius:50%;
  background:linear-gradient(#f64249 0 43%,#153657 44% 56%,#f4f9ff 57%);border:3px solid #153657
}
.ball:after{content:"";position:absolute;left:35%;top:35%;width:30%;height:30%;border-radius:50%;background:#fff;border:2px solid #153657}
.reset{
  position:absolute;right:7px;top:5px;height:30px;padding:0 8px;border-radius:8px;border:1px solid #3c9ee7;
  background:#082757;color:#cceaff;font-size:9px;font-weight:900
}

/* écrans larges (tablette/paysage, comme la maquette de référence) :
   panneau à droite du plateau plutôt qu'en dessous */
@media (min-width:760px) and (min-aspect-ratio: 1/1){
  .board-row{flex-direction:row;align-items:stretch;justify-content:center;gap:16px}
  .board-wrap{width:min(60vh,52vw,560px);flex:0 0 auto;align-self:center}
  .side-panel{width:258px;max-width:258px;justify-content:flex-start;align-self:center}
}

@media(max-height:760px){
  .top-hud{padding-top:6px}.player-card{height:46px}.next-card{height:50px}.next-num{height:24px;line-height:20px;font-size:18px}
  .main-row{padding-top:0}.board-wrap{width:min(88vw,500px)}
  .statusbar{margin-top:4px;min-height:38px}
  .stadium-slot{height:60px}
  .stad-building{transform:scale(.44)}
}
@media(max-height:620px){
  .stadium-slot{height:0;overflow:hidden}
}
</style>
</head>
<body>
<div id="app">
  <div class="top-hud">
    <div class="player-card">
      <div class="avatar-mini">
        <svg viewBox="0 0 70 70" width="100%" height="100%">
          <rect width="70" height="70" fill="#8fd9ff"/>
          <circle cx="35" cy="29" r="14" fill="#efb887"/>
          <path d="M19 29Q22 13 40 14Q51 15 53 29Q35 22 19 29Z" fill="#df303b"/>
          <path d="M17 27Q32 22 50 25L58 30Q36 31 18 31Z" fill="#f04249"/>
          <path d="M24 46Q35 39 47 46L53 70H15Z" fill="#1674cf"/>
          <circle cx="30" cy="29" r="2" fill="#183452"/><circle cx="41" cy="29" r="2" fill="#183452"/>
        </svg>
      </div>
      <div><b>Joueur 1</b><span class="coins">● 1000</span></div>
    </div>
    <div class="next-card"><small>Prochaine case :</small><div class="next-num" id="topNum">1</div></div>
  </div>

  <div class="main-row">
    <div class="stadium" aria-hidden="true">
      <div class="stad-haze"></div>
      <div class="stad-mountain m1"></div>
      <div class="stad-mountain m3"></div>
      <div class="stad-mountain m2"></div>
      <div class="stad-light left"><span class="beam"></span><span class="glow"></span></div>
      <div class="stad-light right"><span class="beam"></span><span class="glow"></span></div>
    </div>

    <div class="stadium-slot" aria-hidden="true">
      <div class="stad-building">
        <div class="flag"></div>
        <div class="antenna"></div>
        <div class="roof"></div>
        <div class="facade">
          <div class="badge"></div>
          <div class="winrow r1">
            <span class="win"></span><span class="win off"></span><span class="win"></span><span class="win"></span>
          </div>
          <div class="winrow r2">
            <span class="win off"></span><span class="win"></span><span class="win"></span><span class="win off"></span>
          </div>
          <div class="door"></div>
        </div>
        <div class="glow-pool"></div>
      </div>
    </div>

    <div class="board-row">
      <div class="board-wrap" id="boardWrap">
        <canvas id="gl"></canvas>
        <div class="hint3d" id="hint3d">🖱️ glisser pour tourner la vue</div>
      </div>

      <div class="side-panel">
        <div class="controls-panel">
          <div class="control-copy">
            <div>
              <div class="side-title">Interface Animateur</div>
              <div class="side-label">Choisissez le nombre de cases</div>
            </div>
            <div class="selector">
              <button class="arrow" id="minus" type="button">‹</button>
              <div class="sel-value" id="sel">1</div>
              <button class="arrow" id="plus" type="button">›</button>
            </div>
          </div>
          <button class="validate" id="validate" type="button">VALIDER</button>
        </div>

        <div class="legend">
          <div class="legend-title">Types de cases :</div>
          <div class="legend-list">
            <div class="legend-row"><span class="sw sw-white"></span>Case classique</div>
            <div class="legend-row"><span class="sw sw-yellow"></span>Gain de pièces</div>
            <div class="legend-row"><span class="sw sw-red"></span>Perte de pièces</div>
            <div class="legend-row"><span class="sw sw-green"></span>Cadeau</div>
            <div class="legend-row"><span class="sw sw-purple"></span>Événement spécial</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="statusbar">
    <span class="ball"></span>
    <span id="status">Le joueur est prêt sur Départ.</span>
    <button class="reset" id="reset" type="button">RECOMMENCER</button>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js" } }
</script>
<script type="module" src="./board3d.js"></script>
</body>
</html>
