<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Plateau Live 3D — 40 cases</title>
<style>
:root{
  --cyan:#19d6ff; --blue:#0d66ff; --navy:#06142c; --navy2:#0b2852;
  --yellow:#ffd83c; --white:#f7fbff; --ink:#102949;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;background:#020714;font-family:Arial,Helvetica,sans-serif}
body{overflow:hidden;color:#fff}
#app{
  width:100vw;height:100dvh;overflow:hidden;
  display:flex;flex-direction:column;
  background:
    radial-gradient(circle at 50% 38%,rgba(20,118,255,.22),transparent 34%),
    linear-gradient(#041126 0 16%,#061733 44%,#020817 100%);
}

/* HUD haut */
.top-hud{
  flex:0 0 auto;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:max(10px,env(safe-area-inset-top)) 12px 6px;
  position:relative;z-index:5;
}
.player-card,.next-card{
  border:2px solid #37caff;
  background:linear-gradient(180deg,#0e4792,#08275b);
  box-shadow:0 0 10px rgba(0,125,255,.6);
  border-radius:12px;
}
.player-card{
  width:132px;height:52px;display:grid;grid-template-columns:43px 1fr;align-items:center;
  padding:4px 7px 4px 3px;
}
.avatar-mini{width:39px;height:39px;border-radius:7px;background:#dcefff;overflow:hidden;border:1px solid #7fe5ff}
.player-card b{display:block;font-size:12px}.coins{font-size:12px;color:#ffd84a;font-weight:900}
.next-card{
  width:160px;height:58px;text-align:center;padding-top:5px;
}
.next-card small{font-weight:800}
.next-num{
  margin:4px auto 0;width:48px;height:29px;line-height:25px;border-radius:6px;
  background:#0d4b99;border:2px solid #50cfff;font-size:22px;font-weight:900
}

/* zone principale = décor + plateau 3D */
.game-zone{
  flex:1 1 auto;min-height:0;position:relative;
  display:flex;align-items:center;justify-content:center;
  padding:2px 10px 4px;
  overflow:hidden;
}
/* décor d'arène derrière le plateau, façon stade */
.game-zone::before{
  content:"";position:absolute;inset:-4% -8% -2%;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 90px 60px at 9% 10%,rgba(255,255,255,.55),transparent 60%),
    radial-gradient(ellipse 90px 60px at 91% 10%,rgba(255,255,255,.5),transparent 60%),
    radial-gradient(ellipse 70% 40% at 50% 6%,rgba(255,150,90,.18),transparent 70%),
    radial-gradient(ellipse 60% 30% at 50% 0%,rgba(120,190,255,.16),transparent 70%);
  filter:blur(1px);
}
.game-zone::after{
  content:"";position:absolute;left:0;right:0;top:6%;height:16%;pointer-events:none;z-index:0;
  background:
    linear-gradient(rgba(255,225,170,.16),transparent),
    repeating-linear-gradient(90deg,rgba(20,40,70,.55) 0 4%,transparent 4% 9%);
  -webkit-mask-image:linear-gradient(#000,transparent);
  mask-image:linear-gradient(#000,transparent);
  opacity:.7;
}

.board-wrap{
  width:min(95vw,680px);
  aspect-ratio:1/1;
  position:relative;z-index:1;
  filter:drop-shadow(0 22px 26px rgba(0,0,0,.55));
}
#gl{
  position:absolute;inset:0;width:100%;height:100%;display:block;
  border-radius:14px;
  cursor:grab;
  touch-action:none;
}
#gl:active{cursor:grabbing}
.gl-fallback{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  text-align:center;padding:20px;font-size:13px;color:#cfe6ff;
  background:radial-gradient(circle at 50% 40%,#0b2852,#040d1f);border-radius:14px;
}
.hint3d{
  position:absolute;left:50%;bottom:6px;transform:translateX(-50%);
  font-size:9px;letter-spacing:.03em;color:rgba(210,235,255,.55);
  background:rgba(4,16,36,.45);border:1px solid rgba(90,190,255,.3);
  border-radius:20px;padding:3px 10px;pointer-events:none;white-space:nowrap;
  transition:opacity .6s ease;z-index:2;
}

/* commandes SOUS le plateau */
.controls-zone{
  flex:0 0 auto;position:relative;z-index:5;
  padding:6px 10px 4px;
}
.controls-panel{
  display:grid;grid-template-columns:1fr auto;gap:8px;
  background:linear-gradient(180deg,#092d63,#051a3d);
  border:2px solid #23a9ff;border-radius:12px;padding:9px;
  box-shadow:0 0 12px rgba(0,127,255,.55);
}
.control-copy{display:flex;align-items:center;justify-content:space-between;gap:8px}
.side-title{font-size:13px;font-weight:900}
.side-label{font-size:10px;color:#d6eeff;margin-top:2px}
.selector{display:grid;grid-template-columns:34px 48px 34px;gap:5px;align-items:center}
.arrow{
  height:36px;border:0;border-radius:8px;background:#0c4b94;color:#fff;font-size:24px;font-weight:900;
  border:1px solid rgba(82,215,255,.55)
}
.sel-value{
  height:38px;display:flex;align-items:center;justify-content:center;border-radius:7px;
  background:#0b4389;border:2px solid #4ed3ff;font-size:24px;font-weight:900
}
.validate{
  min-width:105px;border:0;border-radius:10px;
  background:linear-gradient(#ffe55c,#f4ba12);color:#18304f;font-weight:900;font-size:14px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.6)
}
button:disabled{opacity:.48;filter:grayscale(.7)}
button:active:not(:disabled){transform:translateY(1px)}

/* légende séparée, sous les commandes */
.legend{
  margin-top:6px;
  display:grid;grid-template-columns:repeat(5,1fr);gap:5px;
  background:linear-gradient(180deg,#092a5a,#061833);
  border:1px solid #299fff;border-radius:10px;padding:7px;
  font-size:9px;
}
.legend-row{display:flex;align-items:center;justify-content:center;gap:4px;text-align:center}
.sw{width:9px;height:9px;border-radius:2px;flex:none}
.sw-white{background:linear-gradient(145deg,#eaf5ff,#9dbbd2)}
.sw-yellow{background:linear-gradient(145deg,#ffe154,#f1a714)}
.sw-red{background:linear-gradient(145deg,#ff686e,#dc2946)}
.sw-green{background:linear-gradient(145deg,#55e58c,#07965e)}
.sw-purple{background:linear-gradient(145deg,#c976eb,#8245c8)}

.statusbar{
  margin-top:6px;min-height:42px;border:2px solid #1f98ff;border-radius:10px;
  background:linear-gradient(180deg,#0c3977,#071d44);
  box-shadow:0 0 10px rgba(0,117,255,.42);
  display:flex;align-items:center;justify-content:center;position:relative;
  font-size:12px;font-weight:800;padding:7px 78px 7px 42px
}
.ball{
  position:absolute;left:10px;top:5px;width:30px;height:30px;border-radius:50%;
  background:linear-gradient(#f64249 0 43%,#153657 44% 56%,#f4f9ff 57%);border:3px solid #153657
}
.ball:after{content:"";position:absolute;left:35%;top:35%;width:30%;height:30%;border-radius:50%;background:#fff;border:2px solid #153657}
.reset{
  position:absolute;right:7px;top:5px;height:30px;padding:0 8px;border-radius:8px;border:1px solid #3c9ee7;
  background:#082757;color:#cceaff;font-size:9px;font-weight:900
}

@media(max-height:760px){
  .top-hud{padding-top:6px}.player-card{height:46px}.next-card{height:50px}.next-num{height:24px;line-height:20px;font-size:18px}
  .game-zone{padding-top:0}.board-wrap{width:min(88vw,610px)}
  .controls-zone{padding-top:2px}
  .controls-panel{padding:6px}
  .legend{padding:5px;margin-top:4px}
  .statusbar{margin-top:4px;min-height:38px}
}
</style>
</head>
<body>
<div id="app">
  <div class="top-hud">
    <div class="player-card">
      <div class="avatar-mini">
        <svg viewBox="0 0 70 70" width="100%" height="100%">
          <rect width="70" height="70" fill="#8fd9ff"/>
          <circle cx="35" cy="29" r="14" fill="#efb887"/>
          <path d="M19 29Q22 13 40 14Q51 15 53 29Q35 22 19 29Z" fill="#df303b"/>
          <path d="M17 27Q32 22 50 25L58 30Q36 31 18 31Z" fill="#f04249"/>
          <path d="M24 46Q35 39 47 46L53 70H15Z" fill="#1674cf"/>
          <circle cx="30" cy="29" r="2" fill="#183452"/><circle cx="41" cy="29" r="2" fill="#183452"/>
        </svg>
      </div>
      <div><b>Joueur 1</b><span class="coins">● 1000</span></div>
    </div>
    <div class="next-card"><small>Prochaine case :</small><div class="next-num" id="topNum">1</div></div>
  </div>

  <div class="game-zone">
    <div class="board-wrap" id="boardWrap">
      <canvas id="gl"></canvas>
      <div class="hint3d" id="hint3d">🖱️ glisser pour tourner la vue</div>
    </div>
  </div>

  <div class="controls-zone">
    <div class="controls-panel">
      <div class="control-copy">
        <div>
          <div class="side-title">Interface Animateur</div>
          <div class="side-label">Choisissez le nombre de cases</div>
        </div>
        <div class="selector">
          <button class="arrow" id="minus" type="button">‹</button>
          <div class="sel-value" id="sel">1</div>
          <button class="arrow" id="plus" type="button">›</button>
        </div>
      </div>
      <button class="validate" id="validate" type="button">VALIDER</button>
    </div>

    <div class="legend">
      <div class="legend-row"><span class="sw sw-white"></span>Classique</div>
      <div class="legend-row"><span class="sw sw-yellow"></span>Gain</div>
      <div class="legend-row"><span class="sw sw-red"></span>Perte</div>
      <div class="legend-row"><span class="sw sw-green"></span>Cadeau</div>
      <div class="legend-row"><span class="sw sw-purple"></span>Événement</div>
    </div>

    <div class="statusbar">
      <span class="ball"></span>
      <span id="status">Le joueur est prêt sur Départ.</span>
      <button class="reset" id="reset" type="button">RECOMMENCER</button>
    </div>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js" } }
</script>
<script type="module" src="./board3d.js"></script>
</body>
</html>
