<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Pikapoly — Plateau Live 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#e9c34a; --gold-bright:#ffe27a; --black:#0a0a0a; --black2:#161208;
  --blue:#1a56db; --red:#e0323f; --white:#f7fbff; --ink:#1a1204;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;background:#000;font-family:Arial,Helvetica,sans-serif}
body{overflow:hidden;color:#fff}
#app{
  width:100vw;height:100dvh;overflow:hidden;
  display:flex;flex-direction:column;
  position:relative;
}
/* Fond vivant, troisième approche, bien plus légère que les deux
   précédentes (filtre SVG feTurbulence+feDisplacementMap, puis un
   <canvas> redessiné par bandes en JS à chaque frame) : la photo est
   coupée en 10 bandes horizontales fixes (une fois, au chargement/
   redimensionnement, jamais par frame), chacune animée par un simple
   transform:translateX() en CSS pur. Un transform animé en CSS est
   composité par le GPU sans jamais repasser par le thread principal
   ni redessiner quoi que ce soit une fois lancé — le travail par
   frame tombe donc à ~zéro, contrairement aux deux tentatives
   précédentes qui redessinaient/refiltraient l'image à chaque frame.
   Chaque bande garde son propre petit décalage/vitesse/délai (comme
   les nuages/étoiles déjà animés ailleurs sur cette page) pour un
   mouvement organique, pas synchronisé. */
#bgBands{
  position:absolute; inset:0; overflow:hidden;
  z-index:0; pointer-events:none;
  animation:dragonGlow 9s ease-in-out infinite;
}
/* Écran large (ordinateur) : l'image de fond est au format portrait ;
   en « cover » on n'en voyait que le tiers central. Sur écran large les
   bandes affichent l'image ENTIÈRE en hauteur (voir layout()), et ce
   calque en dessous remplit les côtés avec la même image floutée et
   assombrie, pour ne jamais laisser de zone vide. Invisible en portrait
   (les bandes couvrent tout). */
#bgFill{
  position:absolute; inset:-6%; z-index:0; pointer-events:none; display:none;
  background-image:url("./assets/bg/dragon_sky.jpg");
  background-repeat:no-repeat; background-size:cover; background-position:center;
  filter:blur(22px) brightness(0.45) saturate(1.15);
}
@media (min-aspect-ratio: 1/1){ #bgFill{ display:block; } }
/* Écran large : vraie version paysage de l'image (même scène, cadrée
   large), avec le même découpage en bandes et la même ondulation. */
.bg-band.wide, #bgFill.wide{ background-image:url("./assets/bg/dragon_sky_wide.jpg"); }
@keyframes dragonGlow{
  0%,100%{ filter:brightness(1) saturate(1); }
  50%{ filter:brightness(1.08) saturate(1.12); }
}
.bg-band{
  position:absolute; left:0; width:100%;
  background-image:url("./assets/bg/dragon_sky.jpg");
  background-repeat:no-repeat;
  --amp:2.2px;
  animation-name:bandDrift; animation-timing-function:ease-in-out; animation-iteration-count:infinite;
  animation-duration:8s;
  will-change:transform;
}
@keyframes bandDrift{ 0%,100%{ transform:translateX(calc(var(--amp) * -1)); } 50%{ transform:translateX(var(--amp)); } }
/* Avec une amplitude et une durée IDENTIQUES sur toutes les bandes, seul
   le déphasage (animation-delay) varie d'une bande à l'autre — et ce
   déphasage est fixé par bande en JS (voir layout() plus bas) comme une
   fraction continue de la position verticale, pas par un cycle de
   quelques profils répétés. Deux bandes voisines ont donc un décalage de
   phase minuscule entre elles : leur position instantanée ne peut jamais
   sauter, ce qui élimine la "marche" visible à la jonction — l'amplitude
   seule (sans changement de phase abrupt) ne suffisait pas, l'essai
   précédent avec 6 profils cycliques le montrait encore. */
@media (prefers-reduced-motion: reduce){
  #bgBands{ animation:none; }
  .bg-band{ animation:none; }
}
/* Voile sombre entre la photo de fond et le plateau : la photo seule
   (très claire/chargée) écrasait le contraste du plateau, qui se
   voyait mal par-dessus. Un peu plus sombre sur les bords qu'au
   centre, façon vignette cinéma, pour que le plateau ressorte nettement
   sans pour autant cacher la photo. */
#app::after{
  content:"";
  position:absolute;
  inset:0;
  background:radial-gradient(ellipse at center, rgba(4,7,18,.32) 0%, rgba(4,7,18,.32) 45%, rgba(4,7,18,.6) 100%);
  z-index:0;
  pointer-events:none;
}

/* HUD haut : petit fil d'Ariane doré en haut, puis une bannière de
   destination bien plus grande et clairement séparée en dessous
   (avant, les deux se chevauchaient visuellement, illisibles). */
.top-hud{
  flex:0 0 auto;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  padding:max(10px,calc(env(safe-area-inset-top) + 6px)) 12px 4px;
  position:relative;z-index:5;
}
.brand{
  font-size:10px;font-weight:900;letter-spacing:.14em;color:var(--gold-bright);
  opacity:.8;
  text-shadow:0 0 8px rgba(255,226,122,.5),0 1px 3px rgba(0,0,0,.8);pointer-events:none;
}

/* zone principale = décor de stade + plateau 3D + panneau latéral */
.main-row{
  flex:1 1 auto;min-height:0;position:relative;
  display:flex;flex-direction:column;align-items:stretch;
  padding:2px 10px 4px;
  overflow:hidden;
}
.board-row{
  flex:1 1 auto;min-height:0;position:relative;z-index:1;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
}

/* ---------- décor d'arène (bâtiment, montagnes, projecteurs), tout
   dessiné en CSS pure — un décor original, pas une image reprise
   ailleurs, et sans logo ou signe de marque. ---------- */
.stadium{display:none}
.stad-haze{
  position:absolute;left:0;right:0;top:8%;height:30%;
  background:linear-gradient(180deg,rgba(140,190,255,.16),rgba(140,190,255,0));
}
.stad-mountain{
  position:absolute;bottom:34%;width:62%;height:26%;
  background:linear-gradient(180deg,#33547f,#152a4c);
  clip-path:polygon(0% 100%,8% 55%,20% 78%,32% 40%,46% 68%,58% 30%,72% 62%,86% 45%,100% 100%);
  opacity:.55;
}
.stad-mountain.m1{left:-12%}
.stad-mountain.m2{right:-14%;bottom:33%;height:20%;opacity:.4;filter:hue-rotate(10deg)}
.stad-mountain.m3{left:22%;bottom:37%;width:40%;height:15%;opacity:.28;filter:blur(.5px)}

.stad-light{position:absolute;top:4%;width:6px;height:34%;background:linear-gradient(180deg,#0e2c52,#04101f);border-radius:3px}
.stad-light.left{left:4%}
.stad-light.right{right:4%}
.stad-light .beam{
  position:absolute;top:-2px;left:50%;transform:translateX(-50%);width:2px;height:0;
  border-left:60px solid transparent;border-right:60px solid transparent;border-bottom:150px solid rgba(190,225,255,.14);
  transform-origin:top center;
}
.stad-light.left .beam{transform:translateX(-50%) rotate(18deg)}
.stad-light.right .beam{transform:translateX(-50%) rotate(-18deg)}
.stad-light .glow{
  position:absolute;top:-15px;left:50%;transform:translateX(-50%);width:34px;height:34px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.95),rgba(190,225,255,.5) 45%,transparent 75%);
  box-shadow:0 0 46px 16px rgba(180,225,255,.35);
}

/* Étoiles scintillantes qui tombent en continu dans les marges de
   gauche/droite (jamais au-dessus du plateau, qui a un z-index
   supérieur) — décor léger assorti au ciel de fond. */
.bg-fall{}
.fall-star{
  position:absolute;top:-12%;opacity:0;
  background:radial-gradient(circle,#fff 0%,var(--gold-bright) 45%,var(--gold) 75%,transparent 100%);
  clip-path:polygon(50% 0%,63% 37%,100% 50%,63% 63%,50% 100%,37% 63%,0% 50%,37% 37%);
  filter:drop-shadow(0 0 4px rgba(255,226,122,.75));
  animation-name:fallDrift;animation-timing-function:linear;animation-iteration-count:infinite;
}
@keyframes fallDrift{
  0%{transform:translateY(0) rotate(0deg) scale(1);opacity:0}
  8%{opacity:.85}
  20%{transform:translateY(23vh) rotate(64deg) scale(.65)}
  35%{transform:translateY(40vh) rotate(112deg) scale(1)}
  50%{transform:translateY(57vh) rotate(160deg) scale(.65)}
  65%{transform:translateY(75vh) rotate(208deg) scale(1)}
  80%{transform:translateY(92vh) rotate(256deg) scale(.65)}
  92%{opacity:.85}
  100%{transform:translateY(115vh) rotate(320deg) scale(1);opacity:0}
}
@media (prefers-reduced-motion: reduce){ .fall-star{ display:none; } }

/* Nuages blancs dessinés en CSS : désactivés à la demande — l'utilisateur
   veut que ce soient les vrais nuages peints DANS la photo de fond qui
   bougent (via le travelling bgDrift ci-dessus), pas des nuages en plus
   qui ne collent pas au style de l'illustration. */
.bg-clouds{display:none}
.cloud{
  position:absolute;width:180px;opacity:.5;
  filter:drop-shadow(0 0 7px rgba(255,226,122,.5));
  animation-name:cloudDrift;animation-timing-function:linear;animation-iteration-count:infinite;
}
.cloud.c1{ top:6%;  width:220px; animation-duration:30s; animation-delay:-4s; }
.cloud.c2{ top:20%; width:150px; opacity:.4; animation-duration:38s; animation-delay:-16s; }
.cloud.c3{ top:3%;  width:170px; opacity:.46; animation-duration:34s; animation-delay:-24s; }
.cloud.c4{ top:34%; width:130px; opacity:.35; animation-duration:26s; animation-delay:-9s; }
.cloud.c5{ top:82%; width:240px; opacity:.4;  animation-duration:42s; animation-delay:-30s; }
.cloud.c6{ top:70%; width:160px; opacity:.32; animation-duration:33s; animation-delay:-18s; }
@keyframes cloudDrift{
  0%{ transform:translateX(-30vw); }
  100%{ transform:translateX(130vw); }
}
@media (prefers-reduced-motion: reduce){ .cloud{ display:none; } }

.board-col{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;flex:1 1 auto;min-height:0}
.board-wrap{
  width:min(97vw,88vh,900px);
  aspect-ratio:1/1;
  position:relative;z-index:1;
  filter:drop-shadow(0 22px 26px rgba(0,0,0,.55));
}
#gl{
  position:absolute;inset:0;width:100%;height:100%;display:block;
  border-radius:14px;
  cursor:grab;
  touch-action:none;
}
#gl:active{cursor:grabbing}
.gl-fallback{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  text-align:center;padding:20px;font-size:13px;color:#cfe6ff;
  background:radial-gradient(circle at 50% 40%,#0b2852,#040d1f);border-radius:14px;
}
.hint3d{
  position:absolute;left:50%;bottom:6px;transform:translateX(-50%);
  font-size:9px;letter-spacing:.03em;color:rgba(210,235,255,.55);
  background:rgba(4,16,36,.45);border:1px solid rgba(90,190,255,.3);
  border-radius:20px;padding:3px 10px;pointer-events:none;white-space:nowrap;
  transition:opacity .6s ease;z-index:2;
}

/* panneau latéral : Interface Animateur + légende — masqué : tout se
   pilote désormais au clavier (A/B/C/D/E), le plateau prend toute la
   place. Les boutons restent dans la page (juste invisibles) car le
   jeu s'appuie dessus en interne — les raccourcis clavier cliquent
   dessus par le code, pas besoin qu'ils soient affichés. */
.side-panel{ display:none; }
.controls-panel{
  display:grid;grid-template-columns:1fr auto;gap:8px;
  background:linear-gradient(180deg,#1e1706,#0e0a02);
  border:2px solid var(--gold);border-radius:12px;padding:9px;
  box-shadow:0 0 12px rgba(233,195,74,.4);
}
.control-copy{display:flex;align-items:center;justify-content:space-between;gap:8px}
.side-title{font-size:13px;font-weight:900;color:var(--gold-bright)}
.side-label{font-size:10px;color:#e8d8ae;margin-top:2px}
.selector{display:grid;grid-template-columns:34px 48px 34px;gap:5px;align-items:center}
.arrow{
  height:36px;border:0;border-radius:8px;background:#241a06;color:var(--gold-bright);font-size:24px;font-weight:900;
  border:1px solid rgba(233,195,74,.55)
}
.sel-value{
  height:38px;display:flex;align-items:center;justify-content:center;border-radius:7px;
  background:#241a06;border:2px solid var(--gold-bright);font-size:24px;font-weight:900;color:var(--gold-bright)
}
.validate{
  min-width:105px;border:0;border-radius:10px;
  background:linear-gradient(var(--gold-bright),var(--gold));color:#1a1204;font-weight:900;font-size:14px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.6)
}
.startbtn{
  border:0;border-radius:10px;padding:12px;font-weight:900;font-size:14px;letter-spacing:.02em;
  background:linear-gradient(180deg,#33b46a,#1e7a48);color:#fff;
  box-shadow:0 0 12px rgba(51,180,106,.5);
}
.startbtn[hidden]{display:none}
.resetbank{
  border:1px solid var(--gold);border-radius:8px;padding:6px;font-weight:800;font-size:10.5px;
  background:#1a1406;color:#c9bd97;
}
.resetbank[hidden]{display:none}
.winbtn{
  grid-column:1/3;border:0;border-radius:10px;padding:10px;font-weight:900;font-size:14px;
  background:linear-gradient(180deg,#ffe27a,#e0323f);color:#1a1204;
  box-shadow:0 0 14px rgba(224,50,63,.55);animation:winPulse 1.1s ease-in-out infinite;
}
.winbtn[hidden]{display:none}
@keyframes winPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
.undobtn{
  grid-column:1/3;border:1px solid var(--gold);border-radius:8px;padding:8px;font-weight:800;font-size:12px;
  background:#2a2210;color:#e8dcb0;
}
.undobtn[hidden]{display:none}
button:disabled{opacity:.48;filter:grayscale(.7)}
button:active:not(:disabled){transform:translateY(1px)}

.place-banner-wrap{
  flex:0 0 auto;width:100%;height:clamp(38px,9vw,58px);margin:6px 0 2px;
  display:flex;align-items:center;justify-content:center;overflow:hidden;pointer-events:none;
}
.place-banner{
  font-family:'Cinzel',Georgia,'Times New Roman',serif;font-weight:900;
  font-size:clamp(19px,6.2vw,32px);letter-spacing:.05em;text-transform:uppercase;
  text-align:center;white-space:nowrap;
  background:linear-gradient(180deg,#fff6d8 10%,var(--gold-bright) 55%,var(--gold) 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:var(--gold-bright);
  filter:drop-shadow(0 0 14px rgba(255,226,122,.6)) drop-shadow(0 2px 3px rgba(0,0,0,.75));
  opacity:0;transform:translateY(10px) scale(.94);
  transition:opacity .45s cubic-bezier(.22,.9,.32,1), transform .45s cubic-bezier(.22,.9,.32,1);
}
.place-banner::before, .place-banner::after{
  content:'✦';font-size:.5em;vertical-align:middle;margin:0 .4em;opacity:.85;
}
/* Le nom du lieu reste affiché tant que le pion y est — il ne
   glisse/disparaît que lors du changement de case suivant. */
.place-banner.show{ opacity:1; transform:translateY(0) scale(1); }
/* Retour visible des touches (la barre de statut est masquée) */
.key-hint{
  position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:95;
  background:rgba(10,8,2,.88);border:1px solid var(--gold);color:var(--gold-bright);
  font-size:13px;font-weight:800;letter-spacing:.02em;padding:7px 14px;border-radius:20px;
  max-width:92vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  opacity:0;transition:opacity .2s ease;pointer-events:none;
}
.key-hint.show{ opacity:1; }
/* Repère discret animateur (voir updateCue) : 5 px, à peine visible */
.cue-dot{
  position:fixed;left:7px;bottom:7px;width:5px;height:5px;border-radius:50%;
  opacity:0;pointer-events:none;z-index:80;transition:opacity .8s ease;
}
.brand-star{ transition:color .8s ease; }
.brand-star.cue{ color:#fff1c8; }
.cue-dot.etb{ background:#ffd27a; opacity:.22; }
.cue-dot.coffret{ background:#9db8ff; opacity:.22; }
html.display-mode .cue-dot{ display:none; }

.lots-gallery{
  background:linear-gradient(180deg,#1a1406,#0d0a03);
  border:1px solid var(--gold);border-radius:10px;padding:8px 9px;
}
.lots-gallery-title{
  font-size:11px;font-weight:900;color:var(--gold-bright);letter-spacing:.02em;margin-bottom:6px;
}
.lots-gallery-strip{
  display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch;
}
.lot-thumb{
  flex:0 0 auto;width:48px;display:flex;flex-direction:column;align-items:center;gap:3px;
}
.lot-thumb img{
  width:44px;height:60px;object-fit:cover;border-radius:5px;
  border:2px solid var(--gold-bright);box-shadow:0 2px 6px rgba(0,0,0,.5);
}
.lot-thumb span{
  font-size:7.5px;font-weight:800;color:#e8d8ae;text-align:center;line-height:1.15;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:48px;
}

/* Masquée pour laisser toute la place au plateau (pilotage 100% au
   clavier) — reste dans la page, juste invisible : "recommencer" (C)
   passe par ce bouton en interne. */
.statusbar{ display:none; }
.ball{
  position:absolute;left:10px;top:5px;width:30px;height:30px;border-radius:50%;
  background:linear-gradient(#f64249 0 43%,#153657 44% 56%,#f4f9ff 57%);border:3px solid #153657
}
.ball:after{content:"";position:absolute;left:35%;top:35%;width:30%;height:30%;border-radius:50%;background:#fff;border:2px solid #153657}
.reset{
  position:absolute;right:7px;top:5px;height:30px;padding:0 8px;border-radius:8px;border:1px solid var(--gold);
  background:#1a1406;color:var(--gold-bright);font-size:9px;font-weight:900
}

/* ---------- Écran public (?view=display) : masque toute l'interface
   de contrôle, ne laisse que le plateau, l'annonce et le statut. ---------- */
html.display-mode .side-panel,
html.display-mode .reset{ display:none!important; }
.display-badge{
  display:none;position:fixed;right:14px;bottom:14px;z-index:60;
  background:rgba(10,8,2,.8);border:1px solid var(--gold);color:var(--gold-bright);
  font-size:10px;font-weight:800;letter-spacing:.05em;padding:4px 10px;border-radius:20px;
  pointer-events:none;
}
html.display-mode .display-badge{ display:block; }

/* ---------- Overlay de tirage de cartes (remplace les dés) ---------- */
.card-draw-overlay{
  position:fixed;inset:0;z-index:55;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  background:rgba(6,4,1,.86);opacity:0;visibility:hidden;transition:opacity .25s ease;padding:20px;
}
.card-draw-overlay.show{opacity:1;visibility:visible}
.card-draw-title{
  font-family:'Cinzel',Georgia,serif;font-weight:900;color:var(--gold-bright);
  font-size:clamp(16px,4vw,22px);letter-spacing:.08em;text-transform:uppercase;
}
.card-grid{
  display:grid;grid-template-columns:repeat(6,1fr);gap:9px;width:min(92vw,560px);
  perspective:800px;
}
.mini-card{
  aspect-ratio:5/7;position:relative;transform-style:preserve-3d;
  transition:transform .4s ease, filter .4s ease, opacity .4s ease;
}
/* Le retournement n'est pas un simple rotateY : la carte se soulève
   vers le spectateur à mi-course et se repose. Une rotation plate se
   lit comme un volet qui bascule ; c'est ce demi-temps en avant qui
   donne le geste d'une carte qu'on retourne à la main. */
.mini-card.flipped{ animation:cardTurn .78s cubic-bezier(.2,.85,.25,1) forwards; z-index:3; }
@keyframes cardTurn{
  0%  { transform:rotateY(0deg)   translateZ(0)     scale(1)    rotateZ(0deg); }
  45% { transform:rotateY(90deg)  translateZ(85px)  scale(1.2)  rotateZ(-5deg); }
  72% { transform:rotateY(150deg) translateZ(40px)  scale(1.1)  rotateZ(-2deg); }
  100%{ transform:rotateY(180deg) translateZ(0)     scale(1.04) rotateZ(0deg); }
}
/* Les cartes non tirées reculent pour laisser la scène aux deux
   cartes choisies. */
.mini-card.dim{ filter:brightness(.4) saturate(.55); opacity:.7; transform:scale(.93); }
.mini-card.suspense{ z-index:2; animation:cardLift .5s ease-in-out infinite alternate; }
@keyframes cardLift{
  from{ transform:translateY(0) scale(1); }
  to  { transform:translateY(-7px) scale(1.07); }
}
.mini-card.suspense .back{ animation:suspensePulse .5s ease-in-out infinite; }
@keyframes suspensePulse{
  0%,100%{ box-shadow:0 0 8px rgba(233,195,74,.35); filter:brightness(1); }
  50%{ box-shadow:0 0 26px rgba(255,226,122,.95); filter:brightness(1.25); }
}
.impact-flash{
  position:fixed;inset:0;z-index:90;background:#fff8e0;opacity:0;pointer-events:none;
  transition:opacity .08s ease-out;
}
.impact-flash.hit{ opacity:.55; transition:opacity .04s ease-out; }
.impact-flash.blast{ opacity:1; transition:opacity .05s ease-out; }
/* Orage du jackpot : le décor s'assombrit pendant la séquence */
.bg-band, #bgFill{ transition:filter .5s ease; }
html.storm .bg-band{ filter:brightness(.22) saturate(.6); }
html.storm #bgFill{ filter:blur(22px) brightness(.10) saturate(.8); }

/* Éclair qui zèbre l'écran sur les gros lots, en plus des confettis. */
.lightning-bolt{
  position:fixed;top:6%;left:50%;width:min(38vw,180px);z-index:91;
  transform:translateX(-50%) scale(.7);opacity:0;pointer-events:none;
  filter:drop-shadow(0 0 18px rgba(255,226,122,.9));
}
.lightning-bolt.strike{ animation:boltStrike .8s ease-out; }
@keyframes boltStrike{
  0%{ opacity:0; transform:translateX(-50%) scale(.6); }
  15%{ opacity:1; transform:translateX(-50%) scale(1.05); }
  30%{ opacity:.25; }
  40%{ opacity:1; }
  65%{ opacity:1; transform:translateX(-50%) scale(1.1); }
  100%{ opacity:0; transform:translateX(-50%) scale(1.2); }
}
.mini-card .face{
  position:absolute;inset:0;border-radius:8px;backface-visibility:hidden;
  display:flex;align-items:center;justify-content:center;
}
.mini-card .back{
  /* Vrai dos de carte Pokémon, entier (logo haut et bas compris), sans
     cadre ajouté : l'image remplit toute la carte, seuls les coins
     sont arrondis comme sur une vraie carte. */
  background:#1b3f8c url('./assets/ui/card_back.jpg') center/100% 100% no-repeat;
  border:none;
  box-shadow:0 4px 10px rgba(0,0,0,.55),0 0 8px rgba(233,195,74,.25);
}
/* Face révélée. L'ancienne version était un aplat doré avec un chiffre
   au milieu — d'où l'aspect "rondelle de métal". Ici on reprend le
   vocabulaire des cartes du plateau : fond sombre, halo chaud au
   centre, double liseré or et coins marqués. Le chiffre est éclairé,
   pas posé. */
.mini-card .front{
  transform:rotateY(180deg);
  overflow:hidden;
  border:2px solid var(--gold-bright);
  background:
    radial-gradient(ellipse at 50% 44%, rgba(255,238,175,.20), rgba(255,190,60,0) 62%),
    linear-gradient(158deg,#241a06 0%,#4a3409 42%,#150f04 100%);
  box-shadow:
    inset 0 0 0 1px rgba(0,0,0,.8),
    inset 0 0 0 3px rgba(233,195,74,.55),
    inset 0 0 22px rgba(255,200,90,.25),
    0 8px 22px rgba(0,0,0,.65);
}
/* Coins marqués : quatre équerres dorées, comme sur les cartes-lots du
   plateau. Deux dégradés linéaires suffisent, pas d'image. */
.mini-card .front::after{
  content:"";position:absolute;inset:5px;pointer-events:none;z-index:3;
  background:
    linear-gradient(var(--gold-bright),var(--gold-bright)) left  top   /9px 1.5px no-repeat,
    linear-gradient(var(--gold-bright),var(--gold-bright)) left  top   /1.5px 9px no-repeat,
    linear-gradient(var(--gold-bright),var(--gold-bright)) right top   /9px 1.5px no-repeat,
    linear-gradient(var(--gold-bright),var(--gold-bright)) right top   /1.5px 9px no-repeat,
    linear-gradient(var(--gold-bright),var(--gold-bright)) left  bottom/9px 1.5px no-repeat,
    linear-gradient(var(--gold-bright),var(--gold-bright)) left  bottom/1.5px 9px no-repeat,
    linear-gradient(var(--gold-bright),var(--gold-bright)) right bottom/9px 1.5px no-repeat,
    linear-gradient(var(--gold-bright),var(--gold-bright)) right bottom/1.5px 9px no-repeat;
  opacity:.85;
}
/* Rayons derrière le chiffre : c'est ce qui fait "carte à gagner"
   plutôt que "jeton numéroté". Masqués au centre et sur les bords :
   à pleine intensité partout, l'or noyait le corps sombre de la carte
   et le tout ressemblait à un autocollant soleil, pas à une carte. */
.card-rays{
  position:absolute;inset:-45%;z-index:0;pointer-events:none;
  background:repeating-conic-gradient(from 0deg,
    rgba(255,214,110,.15) 0deg 5deg, rgba(255,214,110,0) 5deg 17deg);
  -webkit-mask-image:radial-gradient(circle at 50% 50%,
    rgba(0,0,0,.15) 10%, #000 40%, rgba(0,0,0,.25) 78%, transparent 100%);
  mask-image:radial-gradient(circle at 50% 50%,
    rgba(0,0,0,.15) 10%, #000 40%, rgba(0,0,0,.25) 78%, transparent 100%);
  animation:cardRaySpin 11s linear infinite;
}
@keyframes cardRaySpin{ to{ transform:rotate(360deg); } }
.card-num{
  position:relative;z-index:2;
  font-family:'Cinzel',Georgia,serif;font-weight:900;
  font-size:clamp(24px,6vw,38px);line-height:1;color:#fff8e2;
  text-shadow:
    0 0 10px rgba(255,214,110,.95),
    0 0 28px rgba(255,168,32,.7),
    0 2px 1px rgba(0,0,0,.75);
}
/* Index dans deux coins opposés, comme sur une vraie carte à jouer. */
.card-pip{
  position:absolute;z-index:3;
  font-family:'Cinzel',Georgia,serif;font-weight:900;
  font-size:clamp(8px,1.9vw,11px);line-height:1;
  color:var(--gold-bright);opacity:.92;
}
.card-pip::after{ content:attr(data-n); }
.card-pip.tl{ top:8px;left:9px; }
/* Index du bas non retourné, contrairement à une carte à jouer : avec
   des chiffres de 1 à 6, un 6 pivoté se lit "9". */
.card-pip.br{ bottom:8px;right:9px; }
/* Reflet holographique qui balaie la carte juste après le
   retournement, comme quand on incline une carte brillante. */
.card-holo{
  position:absolute;inset:0;z-index:4;pointer-events:none;
  background:linear-gradient(112deg,
    transparent 32%, rgba(255,255,255,.5) 45%,
    rgba(170,235,255,.38) 51%, rgba(255,236,170,.34) 56%, transparent 68%);
  background-size:260% 100%;background-position:150% 0;
}
.mini-card.flipped .card-holo{ animation:cardHolo .85s ease-out .42s 1; }
@keyframes cardHolo{
  from{ background-position:150% 0; }
  to  { background-position:-70% 0; }
}

/* ---------- L'impact de la revelation ----------
   Le retournement seul restait sage : la carte arrivait, point. Ici le
   moment ou la face apparait est traite comme un coup — onde de choc qui
   deborde du cadre, chiffre qui se plante, eclats projetes, puis un halo
   qui respire pour que la carte reste vivante ensuite. */
/* Ces deux couches sont filles de .mini-card, donc DANS son contexte 3D :
   apres le retournement la carte est a rotateY(180deg) et elles se
   retrouveraient a l'envers, derriere la face. Le rotateY(180deg)
   translateZ() les remet face camera, devant la carte. */
.card-shock, .card-sparks{
  position:absolute;inset:0;pointer-events:none;z-index:6;
  opacity:0;transform:rotateY(180deg) translateZ(3px);
}
.card-shock{
  border-radius:12px;
  box-shadow:0 0 0 0 rgba(255,226,122,.9);
}
.mini-card.flipped .card-shock{ animation:cardShock .62s cubic-bezier(.15,.8,.3,1) .40s 1; }
@keyframes cardShock{
  0%  { opacity:1; transform:rotateY(180deg) translateZ(3px) scale(.9);
        box-shadow:0 0 0 0 rgba(255,238,170,.95), 0 0 18px 4px rgba(255,200,80,.7); }
  70% { opacity:.55; }
  100%{ opacity:0; transform:rotateY(180deg) translateZ(3px) scale(1.5);
        box-shadow:0 0 0 16px rgba(255,226,122,0), 0 0 34px 10px rgba(255,200,80,0); }
}
/* Huit eclats projetes en etoile depuis la carte. */
.card-sparks i{
  position:absolute;top:50%;left:50%;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;
  border-radius:50%;background:#fffaea;
  box-shadow:0 0 12px 4px rgba(255,214,110,1), 0 0 26px 8px rgba(255,170,40,.55);
}
.card-sparks i:nth-child(1){ --sx: 0px;    --sy:-86px; }
.card-sparks i:nth-child(2){ --sx: 62px;   --sy:-62px; }
.card-sparks i:nth-child(3){ --sx: 86px;   --sy: 0px;  }
.card-sparks i:nth-child(4){ --sx: 62px;   --sy: 62px; }
.card-sparks i:nth-child(5){ --sx: 0px;    --sy: 86px; }
.card-sparks i:nth-child(6){ --sx:-62px;   --sy: 62px; }
.card-sparks i:nth-child(7){ --sx:-86px;   --sy: 0px;  }
.card-sparks i:nth-child(8){ --sx:-62px;   --sy:-62px; }
.mini-card.flipped .card-sparks{ opacity:1; }
.mini-card.flipped .card-sparks i{ animation:cardSpark .70s ease-out .40s 1 both; }
@keyframes cardSpark{
  0%  { opacity:0; transform:translate(0,0) scale(.4); }
  15% { opacity:1; }
  100%{ opacity:0; transform:translate(var(--sx),var(--sy)) scale(.9); }
}
/* Le chiffre se plante au lieu d'apparaitre avec la carte. */
.mini-card.flipped .card-num{ animation:cardStamp .46s cubic-bezier(.16,1.5,.4,1) .38s 1 both; }
@keyframes cardStamp{
  0%  { opacity:0; transform:scale(2.1); filter:blur(3px); }
  55% { opacity:1; filter:blur(0); }
  100%{ opacity:1; transform:scale(1);   filter:blur(0); }
}
/* Une fois posee, la carte garde une pulsation doree discrete : c'est
   ce qui empeche l'ecran de retomber a plat apres le retournement. */
.mini-card.flipped .front{ animation:cardAlive 1.6s ease-in-out 1.15s infinite alternate; }
@keyframes cardAlive{
  from{ box-shadow:
    inset 0 0 0 1px rgba(0,0,0,.8), inset 0 0 0 3px rgba(233,195,74,.55),
    inset 0 0 22px rgba(255,200,90,.25), 0 8px 22px rgba(0,0,0,.65),
    0 0 14px rgba(255,214,110,.35); }
  to  { box-shadow:
    inset 0 0 0 1px rgba(0,0,0,.8), inset 0 0 0 3px rgba(255,238,170,.9),
    inset 0 0 30px rgba(255,210,110,.45), 0 8px 22px rgba(0,0,0,.65),
    0 0 40px rgba(255,214,110,.85); }
}
.card-draw-total{
  font-family:'Cinzel',Georgia,serif;font-weight:900;color:var(--gold-bright);
  font-size:clamp(22px,6vw,36px);text-align:center;text-shadow:0 0 12px rgba(255,226,122,.5);
  min-height:1.4em;
}

/* ---------- Overlay de célébration "Lot remporté" ---------- */
.celebration{
  position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
  pointer-events:none;opacity:0;visibility:hidden;transition:opacity .25s ease;
}
.celebration.show{opacity:1;visibility:visible}
.celebration.shake{animation:celebShake .5s ease}
@keyframes celebShake{
  0%,100%{transform:translate(0,0)} 20%{transform:translate(-8px,4px)} 40%{transform:translate(7px,-5px)}
  60%{transform:translate(-6px,-3px)} 80%{transform:translate(5px,5px)}
}
#celebCanvas{position:absolute;inset:0;width:100%;height:100%}
.celeb-text{
  position:relative;z-index:1;font-size:clamp(20px,6vw,40px);font-weight:900;text-align:center;
  color:var(--gold-bright);text-shadow:0 0 18px rgba(255,226,122,.9),0 2px 4px rgba(0,0,0,.8);
  background:rgba(10,8,2,.55);border:2px solid var(--gold);border-radius:16px;padding:12px 18px;
  animation:celebPop .4s cubic-bezier(.2,1.6,.4,1);
  display:flex;flex-direction:column;align-items:center;gap:10px;max-width:min(96vw,540px);
  max-height:96vh;overflow-y:auto;
}
/* Le lot doit être bien visible même filmé en portrait sur téléphone :
   l'illustration domine tout l'écran plutôt qu'une vignette discrète. */
.celeb-photo{
  width:min(88vw,480px);height:auto;max-height:74vh;border-radius:10px;object-fit:contain;
  border:3px solid var(--gold-bright);display:block;
  box-shadow:0 12px 28px rgba(0,0,0,.6),0 0 26px rgba(255,226,122,.55);
}
.celeb-photo[hidden]{display:none}
/* Révélation d'une pioche Chance/Caisse : le panneau se retourne comme
   une carte qu'on découvre, au lieu d'apparaître d'un coup. Court à
   dessein — c'est le geste du tirage qui est montré, pas un suspense
   étiré sur un résultat déjà tiré. */
.celebration.flip .celeb-text{animation:celebFlip .5s cubic-bezier(.2,.9,.3,1)}
@keyframes celebFlip{
  0%{transform:perspective(900px) rotateY(-92deg) scale(.88);opacity:0}
  55%{transform:perspective(900px) rotateY(9deg) scale(1.03);opacity:1}
  100%{transform:perspective(900px) rotateY(0) scale(1);opacity:1}
}
/* La carte rare se distingue par un halo doré qui respire : le seul
   signal réservé au vrai gros tirage. */
.celebration.rare-card .celeb-text{
  border-color:#fff3c4;
  animation:rareCardGlow 1.2s ease-in-out infinite alternate;
}
.celebration.flip.rare-card .celeb-text{
  animation:celebFlip .5s cubic-bezier(.2,.9,.3,1), rareCardGlow 1.2s ease-in-out .5s infinite alternate;
}
@keyframes rareCardGlow{
  from{box-shadow:0 0 22px rgba(255,226,122,.45)}
  to{box-shadow:0 0 54px rgba(255,238,170,.95),0 0 96px rgba(255,196,60,.5)}
}
/* Fin de partie (case Prison) : un traitement à part, plus sombre et
   dramatique, pour qu'on ne le confonde jamais avec un lot gagné. */
.celebration[data-level="0"]::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(ellipse at center, rgba(120,10,10,.35), rgba(0,0,0,.75) 70%);
  animation:prisonPulse 1.8s ease-in-out infinite;
}
@keyframes prisonPulse{
  0%,100%{opacity:.7} 50%{opacity:1}
}
.celebration[data-level="0"] .celeb-text{
  color:#ff8a8a;border:2px solid #b31414;border-radius:18px;
  background:radial-gradient(ellipse at 50% 30%, rgba(70,6,6,.92), rgba(8,2,2,.96));
  box-shadow:0 0 50px rgba(220,20,20,.55),inset 0 0 40px rgba(0,0,0,.7);
  text-shadow:0 0 22px rgba(255,60,60,.85),0 2px 4px rgba(0,0,0,.9);
}
.celebration[data-level="0"] #celebMain{
  font-family:'Cinzel',Georgia,serif;font-size:clamp(28px,8vw,52px);letter-spacing:.03em;
}
.celebration[data-level="0"] .celeb-sub{color:#ffd9d9}
.celebration[data-level="0"] .celeb-photo{border-color:#b31414;box-shadow:0 12px 28px rgba(0,0,0,.7),0 0 26px rgba(220,20,20,.5)}
.celeb-sub{
  margin-top:8px;font-size:clamp(13px,3.2vw,17px);font-weight:700;color:#fff;
  text-shadow:0 2px 3px rgba(0,0,0,.8);
}
.celeb-sub[hidden]{display:none}

/* ---------- Mode GROS LOT (tripack, coffret, ETB) : la célébration
   s'énerve — rayons lumineux qui tournent derrière le lot, stroboscope
   à l'ouverture, panneau qui claque à l'écran, titre et photo qui
   pulsent. Le canvas des feux d'artifice et la pluie de confettis
   restent derrière la photo pour que le lot reste lisible. ---------- */
.celeb-rays{
  position:absolute;left:50%;top:50%;width:240vmax;height:240vmax;margin:-120vmax 0 0 -120vmax;
  background:repeating-conic-gradient(from 0deg, rgba(255,226,122,0) 0deg 8deg, rgba(255,226,122,.30) 8deg 16deg);
  opacity:0;pointer-events:none;transform-origin:center;will-change:transform;
}
.celebration.big::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at center, rgba(255,200,60,.22), rgba(0,0,0,.6) 72%);
  animation:hypeGlow 1s ease-in-out infinite alternate;
}
@keyframes hypeGlow{from{opacity:.75}to{opacity:1}}
.celebration.big .celeb-rays{opacity:1;animation:raysSpin 7s linear infinite, raysIn .7s ease-out;}
.celebration.big[data-level="4"] .celeb-rays{animation-duration:5s, .7s}
.celebration.big[data-level="5"] .celeb-rays{
  background:repeating-conic-gradient(from 0deg, rgba(255,255,255,0) 0deg 6deg, rgba(255,240,170,.42) 6deg 12deg);
  animation-duration:3.2s, .7s;
}
@keyframes raysSpin{to{transform:rotate(360deg)}}
@keyframes raysIn{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}
/* stroboscope d'ouverture : 3 flashs très courts */
.celebration.big::after{
  content:"";position:absolute;inset:0;pointer-events:none;background:#fff8e0;opacity:0;
  animation:hypeStrobe 1.1s steps(1,end) 1;
}
.celebration.big[data-level="5"]::after{animation:hypeStrobe 1.6s steps(1,end) 1}
@keyframes hypeStrobe{
  0%{opacity:.75} 7%{opacity:0} 14%{opacity:.5} 21%{opacity:0} 30%{opacity:.35} 36%{opacity:0} 100%{opacity:0}
}
/* le panneau claque à l'écran au lieu d'apparaître */
.celebration.big .celeb-text{
  animation:celebSlam .6s cubic-bezier(.2,1.5,.35,1);
  border-width:3px;border-color:#fff3c4;
  box-shadow:0 0 40px rgba(255,226,122,.55),0 0 120px rgba(255,196,60,.35);
}
@keyframes celebSlam{
  0%{transform:scale(3) rotate(-7deg);opacity:0}
  55%{transform:scale(.9) rotate(2deg);opacity:1}
  78%{transform:scale(1.07) rotate(-1deg)}
  100%{transform:scale(1) rotate(0)}
}
.celebration.big #celebMain{
  font-size:clamp(26px,7.5vw,50px);letter-spacing:.02em;
  animation:hypePulse .55s ease-in-out infinite alternate;
}
@keyframes hypePulse{
  from{transform:scale(1);text-shadow:0 0 18px rgba(255,226,122,.9),0 2px 4px rgba(0,0,0,.8)}
  to{transform:scale(1.09);text-shadow:0 0 34px rgba(255,240,170,1),0 0 70px rgba(255,196,60,.8),0 2px 4px rgba(0,0,0,.8)}
}
.celebration.big .celeb-photo{animation:photoHype .9s ease-in-out infinite alternate}
@keyframes photoHype{
  from{box-shadow:0 12px 28px rgba(0,0,0,.6),0 0 26px rgba(255,226,122,.55);transform:scale(1)}
  to{box-shadow:0 12px 28px rgba(0,0,0,.6),0 0 70px rgba(255,236,150,.95),0 0 130px rgba(255,196,60,.5);transform:scale(1.025)}
}
.celebration.big .celeb-sub{
  font-size:clamp(15px,4vw,22px);font-weight:900;color:#fff3c4;letter-spacing:.06em;
  animation:hypeSub .4s ease-in-out infinite alternate;
}
@keyframes hypeSub{from{opacity:.75}to{opacity:1}}
@media (prefers-reduced-motion: reduce){
  .celebration.big .celeb-rays,.celebration.big::after,.celebration.big::before{animation:none}
  .celebration.big #celebMain,.celebration.big .celeb-photo,.celebration.big .celeb-sub,.celebration.big .celeb-text{animation:none}
}

/* Jeton de confirmation "Démarrage cagnotte" (touche E) : un simple
   flash au centre du PLATEAU (pas de l'écran entier, sinon la bande
   du haut décale le centrage) pour confirmer que la commande a bien
   été prise en compte, sans texte ni interaction — disparaît seul.
   Positionné à l'intérieur de .board-wrap (qui est en position
   relative et contient le canvas #gl en inset:0), donc inset:0 ici
   retombe pile sur le centre visuel du plateau. */
.bank-reset-flash{
  position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;
  pointer-events:none;opacity:0;visibility:hidden;transition:opacity .3s ease;
}
.bank-reset-flash.show{opacity:1;visibility:visible;animation:bankFlashPop .5s cubic-bezier(.2,1.6,.4,1)}
.bank-reset-flash img{
  width:min(30vw,150px);height:auto;
  filter:drop-shadow(0 10px 24px rgba(0,0,0,.6)) drop-shadow(0 0 30px rgba(255,110,40,.65));
}
@keyframes bankFlashPop{from{transform:scale(.5) rotate(-8deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
@keyframes celebPop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}

/* écrans larges (tablette/paysage, comme la maquette de référence) :
   panneau à droite du plateau plutôt qu'en dessous */
@media (min-width:760px) and (min-aspect-ratio: 1/1){
  .board-row{flex-direction:row;align-items:stretch;justify-content:center;gap:12px}
  .board-col{flex:1 1 auto;justify-content:center;height:100%}
  /* le plateau occupe toute la hauteur disponible (utile quand
     l'écran est filmé en plan large lors d'un live) plutôt qu'une
     estimation en vh qui laissait de grandes zones vides. */
  /* cadre 3D en 3:2 (et non plus carré) : sur un écran large le plateau
     n'était limité que par la largeur du carré et n'occupait qu'un tiers
     de la page. Plus large, le cadre laisse la caméra se rapprocher
     (board3d.js) jusqu'à ce que le plateau remplisse la hauteur. */
  .board-wrap{width:auto;height:100%;max-height:900px;max-width:100%;aspect-ratio:3/2;flex:0 0 auto;align-self:center}
  .side-panel{width:190px;max-width:190px;justify-content:flex-start;align-self:center}
}

@media(max-height:760px){
  .top-hud{padding-top:max(18px,calc(env(safe-area-inset-top) + 10px))}
  .main-row{padding-top:0}.board-wrap{width:min(92vw,84vh,640px)}
  .statusbar{margin-top:4px;min-height:38px}
}

/* ---------- Téléphone : le plateau doit dominer l'écran, les
   commandes restent compactes pour lui laisser toute la place. ---------- */
@media(max-width:480px){
  .main-row{padding:2px 6px 4px;overflow-y:auto;-webkit-overflow-scrolling:touch}
  /* les commandes sont masquées (pilotage 100% au clavier) : le
     cadre peut être plus haut que large — board3d.js ne recule plus
     la caméra à fond pour ce ratio, donc le plateau grandit vraiment
     au lieu de laisser du vide en haut/bas. */
  .board-wrap{width:min(99vw,94vh,760px);aspect-ratio:2/3}
  .startbtn{padding:8px;font-size:12px}
  .controls-panel{padding:6px}
  .validate{font-size:12px;padding:8px}
  .winbtn{font-size:12px;padding:7px}
  .lots-gallery{padding:6px 7px}
  .lots-gallery-title{font-size:10px}
  .lot-thumb{width:40px}
  .lot-thumb img{width:36px;height:50px}
}

/* ---------- Boutons/commandes toujours compacts : tout l'espace
   gagné va au plateau, qui reste l'élément dominant à l'écran. ---------- */
.startbtn{ padding:9px;font-size:13px }
.controls-panel{ padding:8px }
.validate{ font-size:13px;padding:9px }
.winbtn{ font-size:12.5px;padding:8px }
.lots-gallery{ padding:8px 9px }

/* ---------- Bandeau "derniers gains" sur l'écran public : compact,
   juste des vignettes des lots remportés récemment, pour que le
   plateau reste l'élément dominant à l'écran. ---------- */
.results-ticker{
  display:none;position:absolute;left:8px;right:8px;bottom:8px;z-index:3;
  align-items:center;justify-content:center;gap:7px;pointer-events:none;
}
html.display-mode .results-ticker{ display:flex }
.results-ticker .ticker-item{
  width:36px;height:36px;border-radius:8px;overflow:hidden;flex:none;
  border:2px solid var(--gold-bright);background:#0c0c0c;

<script>
/* Calcule UNE FOIS (au chargement + à chaque resize/rotation — jamais
   par frame d'animation) la position/taille "cover" de la photo de
   fond, puis répartit ce calcul sur les 10 bandes de #bgBands via
   background-size/background-position en pixels. L'ondulation elle-
   même (translateX) est ensuite gérée entièrement par les animations
   CSS déclarées dans le <style> — ce script ne tourne plus jamais une
   fois la mise en page posée, contrairement aux deux tentatives
   précédentes qui redessinaient quelque chose à chaque frame. */
(function(){
  var container = document.getElementById('bgBands');
  if(!container) return;
  var bands = container.querySelectorAll('.bg-band');
  var fill = document.getElementById('bgFill');
  var img = new Image();       // portrait (téléphone)
  var imgWide = new Image();   // paysage (ordinateur) : même scène cadrée large

  function layout(){
    var app = document.getElementById('app');
    var cw = app.clientWidth, ch = app.clientHeight;
    if(cw<=0 || ch<=0) return;
    var wide = cw > ch;
    var src = wide ? imgWide : img;
    var iw = src.naturalWidth, ih = src.naturalHeight;
    if(!iw || !ih) return;
    for(var k=0;k<bands.length;k++) bands[k].classList.toggle('wide', wide);
    if(fill) fill.classList.toggle('wide', wide);
    // "cover" : l'image remplit toute la hauteur et déborde en largeur
    // (jamais l'inverse sur ce format portrait/téléphone) — la marge
    // horizontale ainsi créée est ce qui permet à chaque bande de se
    // décaler de quelques px sans jamais révéler de bord vide.
    // « cover » : l'image choisie (portrait ou paysage) a quasiment le
    // format de l'écran, elle remplit tout sans déformation ni coupe
    // visible ; la marge horizontale laisse les bandes onduler de
    // quelques px sans révéler de bord.
    var scale = Math.max(cw/iw, ch/ih);
    var drawW = iw*scale, drawH = ih*scale;
    var offsetX = (cw-drawW)/2;
    var n = bands.length;
    var bandH = ch/n;
    for(var i=0;i<n;i++){
      var b = bands[i];
      b.style.top = (i*bandH)+'px';
      b.style.height = (bandH+1)+'px'; // +1px : recouvrement léger, pas de trait entre bandes
      b.style.backgroundSize = drawW+'px '+drawH+'px';
      b.style.backgroundPosition = offsetX+'px '+(-i*bandH)+'px';
      // Vague continue de haut en bas : le déphasage de chaque bande
      // avance d'une fraction infime et régulière de la durée totale
      // (WAVE_CYCLES tours complets sur toute la hauteur), jamais par
      // paliers — deux bandes voisines ont donc quasiment la même phase
      // à tout instant, donc quasiment le même décalage horizontal.
      var WAVE_CYCLES = 1.4, DURATION_S = 8;
      b.style.animationDelay = (-(i/n) * WAVE_CYCLES * DURATION_S) + 's';
    }
  }
  window.addEventListener('resize', layout, {passive:true});
  window.addEventListener('orientationchange', function(){ setTimeout(layout,150); }, {passive:true});
  if(window.ResizeObserver){ new ResizeObserver(layout).observe(document.getElementById('app')); }
  img.onload = layout;
  imgWide.onload = layout;
  img.src = './assets/bg/dragon_sky.jpg';
  imgWide.src = './assets/bg/dragon_sky_wide.jpg';
})();
</script>
